<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">axiomd alternative 5 — stacked pages</title>
  <desc id="desc">GNOME Adwaita-style icon concept for the axiomd Markdown reader.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="#241f31" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4"
                    flood-color="#241f31" flood-opacity="0.30"/>
    </filter>
  </defs>


  <rect x="27" y="20" width="76" height="88" rx="14"
        fill="#f6f5f4" opacity=".75"
        stroke="#77767b" stroke-opacity=".14" stroke-width=".8"
        transform="rotate(-5 65 64)"/>
  <rect x="24" y="16" width="80" height="96" rx="15"
        fill="url(#page)" stroke="#77767b" stroke-opacity=".20"
        stroke-width=".8" filter="url(#shadow)"/>
  <path d="M24 31c0-8 7-15 15-15h50c8 0 15 7 15 15v10H24z"
        fill="url(#blue)"/>
  <g fill="#77767b" opacity=".38">
    <rect x="33" y="52" width="50" height="3.1" rx="1.55"/>
    <rect x="33" y="60.5" width="59" height="3.1" rx="1.55"/>
    <rect x="33" y="69" width="43" height="3.1" rx="1.55"/>
  </g>
  <rect x="33" y="80" width="9" height="9" rx="2.2" fill="url(#blue)"/>
  <path d="M35.2 84.1 37.4 86.1 40.2 82.4"
        fill="none" stroke="#fff" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="46" y="82.9" width="23" height="3.1" rx="1.55"
        fill="#77767b" opacity=".38"/>
  <path d="M84 83h20v18c0 7-5 11-12 11H77V90c0-4 3-7 7-7z"
        fill="#241f31" filter="url(#smallShadow)"/>
  <path d="M81.5 103V91h3.1l3.5 4.3 3.5-4.3h3.1v12H92v-6.7l-3.9 4.8-3.9-4.8v6.7z"
        fill="#fff"/>
  <path d="M98 91h3v6h3l-4.5 5.2L95 97h3z" fill="#fff"/>

</svg>
