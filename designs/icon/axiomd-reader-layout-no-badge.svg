<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    The one sanctioned variant of the shipped icon (issue #46): the same polished
    reader layout with the Markdown badge left off, for the owner to compare against
    the badged icon at 32 and 16 on the contact sheet. It is a reference, not a shipped
    asset - the shipped icon is data/icons/hicolor/scalable/apps/io.github.etf.axiomd.svg,
    and the badge stays in it either way. If the pin lands here, the shipped icon gains
    a small-size form and this file is the drawing it is cut from.

    Identical to the shipped icon in every other respect; the task's line of text runs
    its full length here, because nothing is stamped over its end.
  -->
  <defs>
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="112">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="112">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <rect x="20" y="14" width="88" height="104" rx="12" fill="#241f31" opacity=".07"/>
  <rect x="20" y="11" width="88" height="104" rx="12" fill="#241f31" opacity=".09"/>

  <rect x="19" y="7" width="90" height="106" rx="13" fill="#c0bfbc" opacity=".45"/>
  <rect x="20" y="8" width="88" height="104" rx="12" fill="url(#page)"/>

  <rect x="20" y="8" width="20" height="104" rx="12" fill="url(#blue)"/>
  <rect x="32" y="8" width="8" height="104" fill="url(#blue)"/>
  <g fill="#ffffff">
    <circle cx="30" cy="32" r="5"/>
    <circle cx="30" cy="52" r="5"/>
    <circle cx="30" cy="72" r="5"/>
  </g>

  <rect x="48" y="20" width="52" height="16" rx="4" fill="url(#blue)"/>
  <g fill="#9a9996">
    <rect x="48" y="52" width="52" height="8" rx="4"/>
    <rect x="48" y="68" width="44" height="8" rx="4"/>
    <rect x="68" y="88" width="32" height="8" rx="4"/>
  </g>
  <rect x="48" y="84" width="16" height="16" rx="4" fill="url(#blue)"/>
  <path d="M51.2 93.2 55.76 97.76 62.54 89.04 59.86 86.96 55.44 92.64 53.6 90.8Z"
        fill="#ffffff"/>
</svg>
