[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/IllyaYalovyy/axiomd"

[workspace.dependencies]
# Pinned to the platform baseline (GNOME 49): GTK 4.20 / libadwaita 1.8.
# Do not raise these feature gates above what the target platform ships.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_20"] }
