[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/IllyaYalovyy/axiomd"

[workspace.dependencies]
# Pinned to the platform baseline (GNOME 49): GTK 4.20 / libadwaita 1.8.
# Do not raise these feature gates above what the target platform ships.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_20"] }
# WebKitGTK 6.0. Left at the bindings' 2.40 baseline on purpose: every API the
# shell uses predates it, so the build works on any runtime the GNOME 49
# platform or a distro ships. Raise a `v2_xx` gate only for an API that needs it.
webkit6 = "0.6.1"
# GtkSourceView 5: the editor's buffer and view, its Markdown language definition
# and its Adwaita style schemes (issue #21). Left at the bindings' 5.0 baseline for
# the same reason as WebKit above — every API `editor.rs` uses predates 5.2, so the
# build works on any runtime the GNOME 49 platform or a distro ships.
sourceview5 = "0.11.2"
# libspelling, over the same source buffer: the editor's spell checking, which is
# the reader's to switch off (issue #21, and the `spellcheck` key of #20).
libspelling = "0.5.0"
# PDF, in process, for the one thing a print stylesheet cannot do. Measured for issue
# #19 and confirmed by #43: WebKitGTK draws neither a `@page` margin box nor a
# repeating fixed footer, so a page number can only be written onto the paginated
# document — and the owner ruled on 2026-08-05 that page numbers are required. lopdf
# reads the PDF WebKit just wrote and appends one short content stream to each page;
# it is a library rather than a converter, so `design_decisions.md`'s "no subprocess,
# ever" still holds. Pinned to the version the print suite's `pdf-extract` is built on,
# so the build carries one copy of it rather than two, and taken with default features
# off: the four it ships on are date formatting and parallel decompression this uses
# none of.
lopdf = { version = "0.36", default-features = false }
# GIO on its own, for the one crate that needs the desktop without needing a toolkit:
# the document model asks the Documents portal where a document really is (issue #24),
# which is a session-bus call and nothing more. The same GIO `gtk` already brings, so
# this adds no code to the build — it only says which crates may talk to the desktop.
gio = "0.22"
