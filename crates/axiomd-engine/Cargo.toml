[package]
name = "axiomd-engine"
description = "Markdown engine boundary: source in, typed events with source spans out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
comrak = { version = "0.54", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
# The comparison harness (issue #17) measures parse throughput on the very documents
# the performance budgets are measured on, rather than on a second set that could
# quietly diverge from them (`axiomd_e2e::corpus`).
axiomd-e2e = { path = "../axiomd-e2e" }
