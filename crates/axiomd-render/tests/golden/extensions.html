<h1 id="extensions" data-line="1">Extensions</h1>
<p data-line="3">A footnote reference<sup class="footnote-ref"><a id="fnref-fn-note-1" href="#fn-note" rel="noopener noreferrer">1</a></sup> in a sentence.</p>
<p data-line="5">Inline math <math display="inline"><semantics><mrow><mi>E</mi><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">E = mc^2</annotation></semantics></math> and display math:</p>
<p data-line="7"><math display="block"><semantics><mrow><msubsup><mo movablelimits="false">∫</mo><mn>0</mn><mn>1</mn></msubsup><msup><mi>x</mi><mn>2</mn></msup><mspace width="0.16666667em"></mspace><mi>d</mi><mi>x</mi></mrow><annotation encoding="application/x-tex">
\int_0^1 x^2 \, dx
</annotation></semantics></math></p>
<p data-line="11">A <span class="wikilink wikilink-unresolved">Wiki Link</span> and a <span class="wikilink wikilink-unresolved">labelled one</span>.</p>
<blockquote class="callout callout-note" data-line="13">
<p class="callout-title">Note</p>
<p>Callouts keep their kind.</p>
</blockquote>
<blockquote class="callout callout-warning" data-line="16">
<p class="callout-title">Custom title</p>
<p>And their author's title.</p>
</blockquote>
<blockquote class="callout callout-tip" data-line="19">
<p class="callout-title">Tip</p>
<p>Tips too.</p>
</blockquote>
<div class="footnote-definition" id="fn-note" data-line="22">
<sup class="footnote-label">1</sup>
<p>The definition, which keeps its own anchor. <a class="footnote-backref" href="#fnref-fn-note-1" title="Back to the text" rel="noopener noreferrer">↩</a></p>
</div>
</article>
