[package]
name = "axiomd-render"
description = "Rendering pipeline: engine events to sanitized HTML with source anchors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Every word the rendered document says in axiomd's own voice — the card a remote
# image stands behind, the way back from a footnote, the badge a plugin that could not
# draw leaves — is a word the reader reads, so it goes through the translation domain
# like every word in the window around it.
axiomd-i18n = { path = "../axiomd-i18n" }
axiomd-engine = { path = "../axiomd-engine" }
ammonia = "4.1"
# `default-fancy` is `default-onig` with the pure-Rust regex engine: no oniguruma
# C library in the build, and the same syntax and theme dumps.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-latex = "0.8"
