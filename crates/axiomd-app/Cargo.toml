[package]
name = "axiomd-app"
description = "axiomd application shell: GTK 4 + libadwaita windows over the render pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "axiomd"
path = "src/main.rs"

[dependencies]
adw.workspace = true
gtk.workspace = true
webkit6.workspace = true
axiomd-engine = { path = "../axiomd-engine" }
axiomd-render = { path = "../axiomd-render" }

[dev-dependencies]
# The e2e harness drives the binary this package builds, so its tests live here:
# an integration test of a package with a binary target is guaranteed that binary.
axiomd-e2e = { path = "../axiomd-e2e" }
