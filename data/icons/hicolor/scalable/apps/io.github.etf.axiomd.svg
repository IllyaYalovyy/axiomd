<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    axiomd's application icon: the app's own reading layout - an outline sidebar with
    position dots, a heading bar, body text, a checked task and the Markdown badge -
    on the 128x128 canvas GNOME application icons use. The page sits on the portrait
    footprint of the Adwaita icon template: 88 wide, inset 8 from the top, centred on
    the canvas, the same footprint Nautilus and Evince draw their pages on.

    Everything is snapped to the 4-unit grid, because 4 units is one pixel when the
    dock draws this at 32: an edge on a fractional coordinate is a soft edge at every
    size below 128. Nothing is thinner than 8 units (2 pixels at 32) and nothing that
    has to be recognised is thinner than 16.

    Everything here is flat geometry - rectangles, circles, gradients and filled paths.
    No filters, no strokes, no embedded raster: strokes are not recoloured by GTK's
    symbolic machinery, and filters are the part of SVG renderers that differs between
    them, so the shadow under the page is drawn as two offset rectangles rather than as
    a blur. An icon that renders differently in the shell than in the about dialog is
    worse than a plainer one that does not.
    This note is inside `<svg>` and not above it on purpose: gdk-pixbuf recognises
    an SVG by looking at the start of the file, and a comment ahead of the root
    element makes it "not an image" - which is every icon of this application
    missing, and `appstreamcli compose` failing the flatpak build outright. Probed
    on librsvg 2.61.4 / gdk-pixbuf 2.44.4; asserted by
    `crates/axiomd-app/tests/packaging.rs` and `crates/axiomd-app/tests/icon.rs`.
  -->
  <defs>
    <!--
      One ramp for the page and one for everything blue, both in user space over the
      height of the page: the sidebar, the heading bar and the checkbox are lit by the
      same light rather than each carrying its own copy of the gradient.
    -->
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="112">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="112">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <!-- The page's shadow, baked as two offset rectangles. -->
  <rect x="20" y="14" width="88" height="104" rx="12" fill="#241f31" opacity=".07"/>
  <rect x="20" y="11" width="88" height="104" rx="12" fill="#241f31" opacity=".09"/>

  <!-- The page: a hairline of edge under it so it keeps its shape on white. -->
  <rect x="19" y="7" width="90" height="106" rx="13" fill="#c0bfbc" opacity=".45"/>
  <rect x="20" y="8" width="88" height="104" rx="12" fill="url(#page)"/>

  <!-- The outline sidebar, rounded with the page on the left and square on the right. -->
  <rect x="20" y="8" width="20" height="104" rx="12" fill="url(#blue)"/>
  <rect x="32" y="8" width="8" height="104" fill="url(#blue)"/>
  <g fill="#ffffff">
    <circle cx="30" cy="32" r="5"/>
    <circle cx="30" cy="52" r="5"/>
    <circle cx="30" cy="72" r="5"/>
  </g>

  <!-- The document: heading, body text, and a task that is done. -->
  <rect x="48" y="20" width="52" height="16" rx="4" fill="url(#blue)"/>
  <g fill="#9a9996">
    <rect x="48" y="52" width="52" height="8" rx="4"/>
    <rect x="48" y="68" width="44" height="8" rx="4"/>
    <rect x="68" y="88" width="16" height="8" rx="4"/>
  </g>
  <rect x="48" y="84" width="16" height="16" rx="4" fill="url(#blue)"/>
  <path d="M51.2 93.2 55.76 97.76 62.54 89.04 59.86 86.96 55.44 92.64 53.6 90.8Z"
        fill="#ffffff"/>

  <!--
    The Markdown badge, stamped on the page's bottom corner. The white disc under it is
    what keeps the silhouette when the glyph is gone: at 32 the badge is seven pixels
    across and reads as a dark mark with a rim, on a bright app grid and on a dark dock
    alike.
  -->
  <circle cx="98" cy="100" r="18" fill="#ffffff"/>
  <circle cx="98" cy="100" r="14" fill="#241f31"/>
  <path d="M87.5 107V93h3.5l2 3.4 2-3.4h3.5v14h-3.2v-7.4L93 103.2l-2.3-3.6V107Z" fill="#ffffff"/>
  <path d="M102.9 93h3.2v7.6h2.4l-4 6-4-6h2.4Z" fill="#ffffff"/>
</svg>
